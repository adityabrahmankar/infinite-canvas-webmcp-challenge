name = "webmcp-challenge"
main = "worker/index.ts"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENFORCE_RATE_LIMIT = "true"

[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[durable_objects]
bindings = [{ name = "CanvasAgent", class_name = "CanvasAgent" }]

[[migrations]]
tag = "v1"
new_classes = ["AgentQuota"]

[[migrations]]
tag = "v2"
deleted_classes = ["AgentQuota"]
new_sqlite_classes = ["CanvasAgent"]
